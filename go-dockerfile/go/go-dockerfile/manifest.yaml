apiVersion: appdarta.io/v1
kind: CodeTemplate
metadata:
  name: go-dockerfile
  displayName: "Go Service Dockerfile"
  description: "Multi-stage Go Dockerfile + compose fragment + entrypoint: ./cmd/{{ .AgentName }}"
  version: "1.1.0"
  author: "AppDarta Platform"
spec:
  nodeKind: agent
  techStacks: [Go]
  patternKind: simple-service
  files:
    - path: "agents/{{ .AgentName }}/Dockerfile"
      template: "Dockerfile.tmpl"
      description: "Multi-stage Docker build targeting ./cmd/{{ .AgentName }}"
    - path: "agents/{{ .AgentName }}/docker-compose.fragment.yml"
      template: "docker-compose.fragment.yml.tmpl"
      description: "Docker Compose fragment using expose (no host port collision)"
    - path: "agents/{{ .AgentName }}/docker-compose.yml"
      template: "docker-compose.yml.tmpl"
      description: "Standalone compose for single-agent local dev (expose only, no host port collision)"
    - path: "cmd/{{ .AgentName }}/main.go"
      template: "main.go.tmpl"
      description: "Agent entrypoint — satisfies SVC-HAS-MAIN"
  intelligence:
    maturityLevel: stable
    complexityFloor: 1
    complexityIdeal: 2
    complexityCeiling: 5
    tags: [go, dockerfile, agent, service]
templatesApiVersion: "1"
